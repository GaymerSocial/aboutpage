<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaymer.Social — Discontinued</title>
<link rel="icon" href="https://global.media.gaymer.social/icon.png">
<link rel="canonical" href="https://gaymer.social/">
<noscript><meta http-equiv="refresh" content="0; URL=https://gaymer.social/"></noscript>
<script>
  // Redirect to gaymer.social, except when opened locally (dev-server), where the dev banner shows instead.
  // ?nodev=1 tests the real redirect. Without JS the <noscript> meta refresh does the redirect.
  (function () {
    var h = location.hostname;
    var local = h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
    if (local && !/(?:^|[?&])nodev=1(?:&|$)/.test(location.search)) return;
    location.replace('https://gaymer.social/');
  })();
</script>
<link rel="stylesheet" href="/assets/site-banner.css">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e8eb;
    text-align: center;
    padding: 2rem;
    box-sizing: border-box;
  }
  .card { max-width: 32rem; }
  a { color: #8ab4ff; }
  .footer-powered {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(255,255,255,.15);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    flex-wrap: wrap;
    font-size: .76rem;
    color: #9a9ba5;
  }
  .footer-powered-sep { color: rgba(255,255,255,.25); }
  .site-banners { --banner-page-bg: #0f1115; --banner-text: #e6e8eb; --banner-site: #8ab4ff; --banner-site-light: #8ab4ff; }
  
  .footer-powered-item, .footer-powered-item:visited { display: inline-flex; align-items: center; color: #9a9ba5; text-decoration: none; transition: color .2s; }
  .footer-powered-item:hover, .footer-powered-item:focus-visible { color: #e6e8eb; }
  .footer-powered-logo { height: 28px; width: auto; display: block;
    filter: grayscale(1) brightness(1); opacity: .7; transition: filter .2s ease, opacity .2s ease;
    will-change: filter, opacity; backface-visibility: hidden; transform: translateZ(0); }
  
  .footer-powered-item:hover .footer-powered-logo, .footer-powered-item:focus-visible .footer-powered-logo { filter: grayscale(0) brightness(1); opacity: 1; }
  .made { margin: 0; font-size: .76rem; color: #9a9ba5; }
  .made a, .made a:visited { color: #9a9ba5; transition: color .2s; }
  .made a:hover, .made a:focus-visible { color: #e6e8eb; }
  .made-icon { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; }
  /* optical sizing: solid heart scaled down to match the code and coffee icons */
  .made-love { font-size: 0.85em; } .made-code { font-size: 1em; } .made-coffee { font-size: 0.95em; }
  .made-love { color: #e5484d; } .made-code { color: #30a46c; } .made-coffee { color: #a0703f; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  @media (prefers-reduced-motion: reduce) { .footer-powered-item, .footer-powered-logo, .made a { transition: none; } }
  body { padding-top: calc(2rem + var(--banner-h)); }
</style>
</head>
<body>
<div class="card">
  <p>Gaymer.Social and Gaymer.Coffee were discontinued in September 2026. Redirecting you to <a href="https://gaymer.social/">gaymer.social</a>&hellip;</p>
  <div class="footer-powered">
    <a href="https://stux.group" class="footer-powered-item" target="_blank" rel="noopener">
      <img src="https://global.media.stux.group/logo.png" alt="Stux.Group" class="footer-powered-logo" height="28">
    </a>
    <span class="footer-powered-sep">|</span>
    <a href="https://services.stux.group" class="footer-powered-item" target="_blank" rel="noopener">A Stux.Group Service</a>
  </div>
  <p class="made">Created with <svg class="made-icon made-love" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" focusable="false"><title>Love</title><path fill="currentColor" d="M12 21.2 10.6 20C5.4 15.3 2 12.2 2 8.4 2 5.3 4.4 3 7.4 3c1.7 0 3.4.8 4.6 2.1C13.2 3.8 14.9 3 16.6 3 19.6 3 22 5.3 22 8.4c0 3.8-3.4 6.9-8.6 11.6z"/></svg> / <svg class="made-icon made-code" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" focusable="false"><title>Code</title><path fill="currentColor" d="M8.3 6.3 9.7 7.7 5.4 12l4.3 4.3-1.4 1.4L2.6 12zm7.4 0L21.4 12l-5.7 5.7-1.4-1.4 4.3-4.3-4.3-4.3zM13.6 3.7l1.9.6-5 16-1.9-.6z"/></svg> / <svg class="made-icon made-coffee" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" focusable="false"><title>Coffee</title><path fill="currentColor" d="M3 8h14v6a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5zm14 1.5h1.5a2.5 2.5 0 0 1 0 5H17v-2h1.5a.5.5 0 0 0 0-1H17zM6 2h2v4H6zm4 0h2v4h-2zM2 20h16v2H2z"/></svg><span class="sr-only"> love, code and coffee</span> by <a href="https://gaymer.social" target="_blank" rel="noopener">Gaymer.Social</a></p>
</div>
<script>
  // Dev banner: only when opened locally (dev-server); never in production, and no browser storage.
  // ?banner=soon,maintenance,site previews the other variants.
  (function () {
    var h = location.hostname;
    if (h !== 'localhost' && h !== '127.0.0.1' && h !== '[::1]') return;
    if (/(?:^|[?&])nodev=1(?:&|$)/.test(location.search)) return;
    var copy = {
      maintenance: ['Maintenance', 'Gaymer.Social is being updated and will be back shortly.'],
      soon: ['Coming soon', 'Gaymer.Social is launching soon.'],
      dev: ['Dev mode', 'Local preview of Gaymer.Social. Add ?nodev=1 to the URL to see it as production does, with the redirect to gaymer.social.'],
      site: ['Notice', 'A site notice for Gaymer.Social appears here.']
    };
    var want = (new URLSearchParams(location.search).get('banner') || '').split(',');
    var order = ['maintenance', 'soon', 'dev', 'site'];
    var show = order.filter(function (v) { return v === 'dev' || want.indexOf(v) !== -1; });
    document.documentElement.classList.add('has-site-banner', 'site-banner-fixed');
    document.addEventListener('DOMContentLoaded', function () {
      var box = document.createElement('div');
      box.className = 'site-banners site-banners--fixed';
      box.setAttribute('data-site-banners', '');
      show.forEach(function (v) {
        var b = document.createElement('div');
        b.className = 'site-banner site-banner--' + v;
        b.setAttribute('role', v === 'dev' ? 'note' : 'status');
        var l = document.createElement('span'); l.className = 'site-banner-label'; l.textContent = copy[v][0];
        var t = document.createElement('span'); t.className = 'site-banner-text'; t.textContent = copy[v][1];
        b.appendChild(l); b.appendChild(t); box.appendChild(b);
      });
      document.body.insertBefore(box, document.body.firstChild);
      var s = document.createElement('script'); s.src = '/assets/site-banner.js'; document.body.appendChild(s);
    });
  })();
</script>
</body>
</html>
